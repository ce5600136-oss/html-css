<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>

        body{

            font-family: Arial, Helvetica, sans-serif;

        }

        caption{

            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: bisque;
        }

        table{

            width:500px;
            border-collapse: collapse;

        }

        td, th{

            border: 1px solid black;
            padding: 10px;

        }

        tbody > tr:nth-child(2n){

            background-color: darkgrey;

        }

        thead > tr > th {

            position: sticky;
            background-color: gray;
            top: -1px;

        }

        thead, tfoot{

            background-color: gray;
            color: white;

        }

        td.num{

            text-align: right;

        }


    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!--    ANATOMIA PARA TABELAS GRANDES
    CAPTION
    TABLE
        THEAD
            TR, TD, TH
        TBODY
            TR, TD, TH
        TFOOT
            TR, TD, TH
    -->

    <table>
        <caption>População das Unidades Federativas</caption>
        <thead>
            <tr>
                <th>Estado</th>
                <th>Populacão</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">45.000.000</td>

            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21.000.000</td>
            </tr>
            <tr>

                <td>Rio de Janeiro</td>
                <td class="num">17.000.000</td>

            </tr>
        </tbody>
        <tfoot>

            <tr>
                <th>Total de Habitantes</th>
                <th>83.000.000</th>
            </tr>

        </tfoot>


    </table>
</body>
</html>
