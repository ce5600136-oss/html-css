<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pseudo elementos</title>
    <style>

/*SELETORES PERSONALIZADOS

# = id
. = class
: = pseudo class
:: = pseudo element
> = children

*/


body{

    font-family: Arial, Helvetica, sans-serif;
}

a{

color: red;
text-decoration: none;
font-weight: bold;
}
a:visited{

color: rgb(131, 11, 11);

}

a:hover{

color: black;
text-decoration: underline;

}

a:active{

color: brown;

}




    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://www.youtube.com/">youtube</a></li>
        <li><a href="https://github.com/gustavoguanabara/html-css/blob/master/aulas-pdf/15%20-Seletores%20personalizados.pdf" class="destaque">guanabara github</a></li>
    </ul>
</body>
</html>
