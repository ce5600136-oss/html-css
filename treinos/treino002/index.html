<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Pause o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>

    <ul>

        <li><abbr title="Utilizamos a tag &lt;p&gt; &lt;/p&gt;">Parágrafo</abbr></li>
        <li><abbr title="Utilizamos a tag &lt;br&gt; &lt;/br&gt; ">Quebrar Linha</abbr></li>
        <li><abbr title="Utilizamos as tags &lt;strong&gt; &lt;/strong&gt;">Negrito</abbr></li>
        <li><abbr title="Utilizamos as tags &lt;em&gt; &lt;/em&gt; e &lt;i&gt; &lt;/i&gt;">Itálico</abbr></li>
        <li><abbr title="Utilizamos a tag &lt;abbr&gt; &lt;/abbr&gt;">Abreviações</abbr></li>
        <li><abbr title="Utilizamos a tag &lt;ol&gt; &lt;/ol&gt;">Listas ordenadas</abbr></li>
        <li><abbr title="Utilizamos a tag &lt;ul&gt; &lt;/ul&gt;">Listas desordenadas</abbr></li>
        <li><abbr title="Utilizamos a tag &lt;a&gt; &lt;/a&gt;">Hyperlinks</abbr></li>
    </ul>
</body>
</html>
